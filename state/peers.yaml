schema: cnos.peers.v0
peers:
  - agent: usurobor/cn-sigma
    home: https://github.com/usurobor/cn-sigma
    trust: registered-repo
    activations:
      - handle: cn-sigma@cnos
        locus: usurobor/cnos
        runtime: {engine: claude}
        dialogue: {repo: usurobor/cnos, ref: refs/heads/cn-sigma/cnos/dialogue}
      - handle: cn-sigma@cmp
        locus: usurobor/cmp
        runtime: {engine: claude}
        dialogue: {repo: usurobor/cmp, ref: refs/heads/cn-sigma/cmp/dialogue}
      - handle: cn-sigma@tsc
        locus: usurobor/tsc
        runtime: {engine: claude}
        dialogue: {repo: usurobor/tsc, ref: refs/heads/cn-sigma/tsc/dialogue}
