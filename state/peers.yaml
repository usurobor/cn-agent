schema: cnos.peers.v0
peers:
  - agent: usurobor/cn-pi
    home: https://github.com/usurobor/cn-pi
    trust: registered-repo
    activations:
      - handle: cn-pi@cnos
        locus: usurobor/cnos
        runtime: {engine: gpt}
        dialogue: {repo: usurobor/cnos, ref: refs/heads/cn-pi/cnos/dialogue}
      - handle: cn-pi@cmp
        locus: usurobor/cmp
        runtime: {engine: gpt}
        dialogue: {repo: usurobor/cmp, ref: refs/heads/cn-pi/cmp/dialogue}
      - handle: cn-pi@tsc
        locus: usurobor/tsc
        runtime: {engine: gpt}
        dialogue: {repo: usurobor/tsc, ref: refs/heads/cn-pi/tsc/dialogue}
  - agent: usurobor/cn-omega
    home: https://github.com/usurobor/cn-omega   # verified: exists, active (private)
    trust: registered-repo
    activations:
      # Provisional: cn-omega has not yet published a dialogue feed at the cnos
      # locus (no refs/heads/cn-omega/cnos/* exist yet), and its runtime engine
      # is unverified. Routing follows protocol convention; confirm on first pull.
      - handle: cn-omega@cnos
        locus: usurobor/cnos
        runtime: {engine: unknown}
        dialogue: {repo: usurobor/cnos, ref: refs/heads/cn-omega/cnos/dialogue}
